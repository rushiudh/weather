<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f4f7f6;
            padding: 50px;
        }
        .card {
            background: white;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-width: 300px;
        }
        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .status {
            font-weight: bold;
            color: #666;
            margin-top: 10px;
        }
        .weather-info {
            display: none;
            margin-top: 20px;
            text-align: left;
            border-top: 1px solid #eee;
            padding-top: 15px;
        }
        .info-item {
            margin: 8px 0;
            font-size: 16px;
            color: #333;
        }
        .value {
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>Device Location Weather</h2>
    <p>Click below to fetch live data for your exact coordinates.</p>
    <button onclick="getLiveWeather()">Get My Weather</button>

    <div id="status-message" class="status"></div>

    <div id="weather-details" class="weather-info">
        <div class="info-item">Condition: <span id="w-condition" class="value">-</span></div>
        <div class="info-item">Temperature: <span id="w-temp" class="value">-</span></div>
        <div class="info-item">Wind Speed: <span id="w-wind" class="value">-</span></div>
        <div class="info-item">Time Context: <span id="w-time" class="value">-</span></div>
    </div>
</div>

<script>
    function getWeatherCondition(code) {
        switch (code) {
            case 0: return "Clear Sky";
            case 1: case 2: case 3: return "Mainly Clear / Partly Cloudy";
            case 45: case 48: return "Foggy";
            case 51: case 53: case 55: return "Drizzle";
            case 61: case 63: case 65: return "Rainy";
            case 71: case 73: case 75: return "Snowy";
            case 95: case 96: case 99: return "Thunderstorm";
            default: return "Unknown (" + code + ")";
        }
    }

    function getLiveWeather() {
        const status = document.getElementById('status-message');
        const details = document.getElementById('weather-details');

        status.innerHTML = "Detecting device location...";
        details.style.display = "none";

        if (!navigator.geolocation) {
            status.innerHTML = "Geolocation is not supported by your browser.";
            return;
        }

        navigator.geolocation.getCurrentPosition(
            (position) => {
                const lat = position.coords.latitude;
                const lon = position.coords.longitude;
                status.innerHTML = "Location found. Querying backend app...";

                fetch('/weather', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        latitude: lat,
                        longitude: lon
                    })
                })
                .then(response => {
                    if (!response.ok) throw new Error("Backend service error");
                    return response.json();
                })
                .then(data => {
                    status.innerHTML = "Weather data updated successfully!";

                    const weather = data.current_weather;

                    document.getElementById('w-condition').innerText = getWeatherCondition(weather.weathercode);
                    document.getElementById('w-temp').innerText = `${weather.temperature}°C`;
                    document.getElementById('w-wind').innerText = `${weather.windspeed} km/h`;
                    document.getElementById('w-time').innerText = weather.is_day === 1 ? "Daytime" : "Nighttime";

                    details.style.display = "block";
                })
                .catch(error => {
                    status.innerHTML = `<span style="color: red;">Error: ${error.message}</span>`;
                });
            },
            (error) => {
                status.innerHTML = `Location unavailable: ${error.message}`;
            },
            {
                enableHighAccuracy: false,
                timeout: 10000,
                maximumAge: 60000
            }
        );
    }
</script>

</body>
</html>
